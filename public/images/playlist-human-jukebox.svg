<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="55%" stop-color="#071228"/>
      <stop offset="100%" stop-color="#0a0520"/>
    </linearGradient>

    <!-- Cyan glow radial -->
    <radialGradient id="glow-cyan" cx="38%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#5dd7ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5dd7ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink/purple glow radial right -->
    <radialGradient id="glow-purple" cx="80%" cy="60%" r="42%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Text glow filter -->
    <filter id="text-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Icon glow filter -->
    <filter id="icon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="800" height="350" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="310" cy="175" rx="280" ry="200" fill="url(#glow-cyan)"/>
  <ellipse cx="640" cy="210" rx="240" ry="180" fill="url(#glow-purple)"/>

  <!-- Horizontal scan line subtlety -->
  <rect width="800" height="1" y="174" fill="#5dd7ff" opacity="0.07"/>
  <rect width="800" height="1" y="176" fill="#5dd7ff" opacity="0.04"/>

  <!-- ── Jukebox icon (left side) ── -->
  <g transform="translate(72, 68)" filter="url(#icon-glow)" opacity="0.92">
    <!-- Jukebox body -->
    <rect x="0" y="40" width="120" height="156" rx="18" fill="none" stroke="#5dd7ff" stroke-width="2.5"/>
    <!-- Dome top -->
    <path d="M0 58 Q60 0 120 58" fill="none" stroke="#5dd7ff" stroke-width="2.5"/>
    <!-- Speaker grille -->
    <rect x="14" y="100" width="92" height="58" rx="8" fill="none" stroke="#5dd7ff" stroke-width="1.8" opacity="0.7"/>
    <line x1="14" y1="116" x2="106" y2="116" stroke="#5dd7ff" stroke-width="1.2" opacity="0.45"/>
    <line x1="14" y1="130" x2="106" y2="130" stroke="#5dd7ff" stroke-width="1.2" opacity="0.45"/>
    <line x1="14" y1="144" x2="106" y2="144" stroke="#5dd7ff" stroke-width="1.2" opacity="0.45"/>
    <!-- Record slot -->
    <rect x="22" y="174" width="76" height="10" rx="5" fill="none" stroke="#5dd7ff" stroke-width="1.5" opacity="0.6"/>
    <!-- Top buttons -->
    <circle cx="30" cy="72" r="8" fill="none" stroke="#5dd7ff" stroke-width="1.8" opacity="0.8"/>
    <circle cx="60" cy="68" r="8" fill="none" stroke="#5dd7ff" stroke-width="1.8" opacity="0.8"/>
    <circle cx="90" cy="72" r="8" fill="none" stroke="#5dd7ff" stroke-width="1.8" opacity="0.8"/>
    <!-- Glow dots on buttons -->
    <circle cx="30" cy="72" r="3" fill="#5dd7ff" opacity="0.7"/>
    <circle cx="60" cy="68" r="3" fill="#5dd7ff" opacity="0.7"/>
    <circle cx="90" cy="72" r="3" fill="#5dd7ff" opacity="0.7"/>
  </g>

  <!-- ── Main text block ── -->
  <g filter="url(#text-glow)">
    <!-- THE -->
    <text x="240" y="145"
      font-family="'Bebas Neue', 'Arial Black', sans-serif"
      font-size="38"
      font-weight="700"
      letter-spacing="14"
      fill="#5dd7ff"
      opacity="0.75">THE</text>

    <!-- HUMAN -->
    <text x="234" y="218"
      font-family="'Bebas Neue', 'Arial Black', sans-serif"
      font-size="88"
      font-weight="900"
      letter-spacing="6"
      fill="#ffffff">HUMAN</text>

    <!-- JUKEBOX -->
    <text x="234" y="288"
      font-family="'Bebas Neue', 'Arial Black', sans-serif"
      font-size="74"
      font-weight="900"
      letter-spacing="10"
      fill="#5dd7ff">JUKEBOX</text>
  </g>

  <!-- Decorative neon underline beneath JUKEBOX -->
  <line x1="234" y1="298" x2="710" y2="298" stroke="#5dd7ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Subtle vertical accent lines -->
  <line x1="218" y1="120" x2="218" y2="300" stroke="#5dd7ff" stroke-width="1" opacity="0.3"/>

  <!-- Music note deco top-right -->
  <text x="720" y="120"
    font-family="serif"
    font-size="52"
    fill="#5dd7ff"
    opacity="0.2">♪</text>
  <text x="748" y="78"
    font-family="serif"
    font-size="30"
    fill="#a855f7"
    opacity="0.18">♫</text>
</svg>
