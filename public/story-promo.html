<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Human Jukebox – Story Promo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* 1080×1920 stage, scaled to fit any screen */
    .stage {
      width: 1080px;
      height: 1920px;
      position: absolute;
      top: 0; left: 0;
      overflow: hidden;
      transform-origin: top left;
    }

    /* ── Background ── */
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 12%, rgba(74,214,255,0.22) 0%, transparent 40%),
        radial-gradient(circle at 80% 8%,  rgba(255,79,152,0.18) 0%, transparent 38%),
        radial-gradient(circle at 50% 92%, rgba(74,214,255,0.14) 0%, transparent 45%),
        linear-gradient(180deg, #060919 0%, #0d1534 50%, #060919 100%);
      animation: bgPulse 4s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      from { opacity: 0.85; }
      to   { opacity: 1; }
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(74,214,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,214,255,0.04) 1px, transparent 1px);
      background-size: 72px 72px;
    }

    .scanline {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 3px,
        rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
    }

    /* ── Floating particles ── */
    .particles { position: absolute; inset: 0; pointer-events: none; }
    .particle {
      position: absolute;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
      8%   { opacity: 0.55; }
      92%  { opacity: 0.3; }
      100% { transform: translateY(-2000px) rotate(720deg); opacity: 0; }
    }

    /* ── Scenes ── */
    .scene {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease;
      padding: 80px;
      gap: 20px;
    }
    .scene.active  { opacity: 1; }

    /* ── Logo ── */
    .logo {
      object-fit: contain;
      filter:
        drop-shadow(0 0 40px rgba(74,214,255,0.9))
        drop-shadow(0 0 90px rgba(74,214,255,0.4));
      animation: logoPulse 2s ease-in-out infinite alternate;
    }
    @keyframes logoPulse {
      from { filter: drop-shadow(0 0 30px rgba(74,214,255,0.6)) drop-shadow(0 0 70px rgba(74,214,255,0.3)); }
      to   { filter: drop-shadow(0 0 70px rgba(74,214,255,1))   drop-shadow(0 0 140px rgba(74,214,255,0.6)); }
    }

    /* ── Typography ── */
    .big   { font-family: 'Bebas Neue', sans-serif; line-height: 0.88; text-align: center; letter-spacing: 4px; color: #fff; text-shadow: 0 0 40px rgba(255,255,255,0.4); }
    .pink  { color: #ff4f98; text-shadow: 0 0 40px rgba(255,79,152,0.9), 0 0 90px rgba(255,79,152,0.4); }
    .cyan  { color: #4ad6ff; text-shadow: 0 0 40px rgba(74,214,255,1),   0 0 90px rgba(74,214,255,0.5); }

    .sub  { font-family: 'Inter', sans-serif; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 8px; color: rgba(255,255,255,0.65); }
    .body { font-family: 'Inter', sans-serif; font-weight: 900; text-align: center; line-height: 1.1; color: #fff; }
    .url  { font-family: 'Inter', sans-serif; font-weight: 700; text-align: center; color: #4ad6ff; text-shadow: 0 0 20px rgba(74,214,255,0.9); animation: glowPulse 1.4s ease-in-out infinite; }

    @keyframes glowPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }

    /* ── Neon divider ── */
    .neon-line {
      width: 680px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #4ad6ff 30%, #ff4f98 70%, transparent);
      box-shadow: 0 0 18px rgba(74,214,255,0.8);
      flex-shrink: 0;
    }

    /* ── Visualizer ── */
    .visualizer { display: flex; align-items: flex-end; gap: 10px; height: 140px; }
    .bar {
      width: 20px;
      border-radius: 10px;
      background: linear-gradient(180deg, #ff4f98, #4ad6ff);
      box-shadow: 0 0 12px rgba(74,214,255,0.5);
      animation: barDance ease-in-out infinite alternate;
    }
    @keyframes barDance {
      from { height: 12%; }
      to   { height: 100%; }
    }

    /* ── Entrance animations ── */
    .slide-up   { animation: slideUp   0.65s cubic-bezier(0.22,1,0.36,1) both; }
    .slide-down { animation: slideDown 0.65s cubic-bezier(0.22,1,0.36,1) both; }
    .smash      { animation: smashIn   0.55s cubic-bezier(0.22,1,0.36,1) both; }

    @keyframes slideUp   { from { transform: translateY(120px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(-120px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes smashIn   { 0% { transform: scale(3.2); opacity: 0; } 65% { transform: scale(0.94); } 100% { transform: scale(1); opacity: 1; } }

    /* ── Flash transition ── */
    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
    }
    .flash.go { animation: flashOut 0.35s ease-out forwards; }
    @keyframes flashOut { 0% { opacity: 0.45; } 100% { opacity: 0; } }

    /* ── Restart button ── */
    #restart {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 500;
      background: rgba(13,21,52,0.85);
      border: 1px solid rgba(74,214,255,0.4);
      color: #4ad6ff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      text-transform: uppercase;
    }
    #restart:hover { background: rgba(74,214,255,0.15); }
  </style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="particles" id="particles"></div>
  <div class="scanline"></div>

  <!-- ── SCENE 1: Logo intro (0 – 3.5 s) ── -->
  <div class="scene" id="s1" style="gap:60px">
    <img class="logo slide-up" src="./the-human-jukebox-logo.png" alt="Human Jukebox" style="width:340px;height:340px" />
    <div class="sub slide-up" style="font-size:52px; letter-spacing:12px; animation-delay:.35s">Human Jukebox</div>
    <div class="body slide-up" style="font-size:44px; color:rgba(255,255,255,0.45); animation-delay:.55s">Live music. Real interaction.</div>
  </div>

  <!-- ── SCENE 2: YOU CHOOSE THE SONGS (3.5 – 8 s) ── -->
  <div class="scene" id="s2">
    <div class="big pink smash"    style="font-size:220px">YOU</div>
    <div class="big cyan slide-up" style="font-size:150px; animation-delay:.3s">CHOOSE</div>
    <div class="big slide-up"      style="font-size:120px; animation-delay:.5s">THE SONGS</div>
    <div class="neon-line slide-up" style="animation-delay:.7s; margin:20px 0"></div>
    <div class="sub slide-up"      style="font-size:44px; letter-spacing:5px; animation-delay:.85s">Every request. Every night. Live.</div>
  </div>

  <!-- ── SCENE 3: The crowd votes (8 – 12.5 s) ── -->
  <div class="scene" id="s3">
    <div class="visualizer" id="visualizer"></div>
    <div class="big slide-down"    style="font-size:130px">THE CROWD</div>
    <div class="big pink smash"    style="font-size:200px; animation-delay:.3s">VOTES</div>
    <div class="body slide-up"     style="font-size:60px; color:rgba(255,255,255,0.55); animation-delay:.5s">The setlist belongs to you</div>
  </div>

  <!-- ── SCENE 4: Every night is different (12.5 – 17 s) ── -->
  <div class="scene" id="s4">
    <div class="body slide-down"   style="font-size:72px; color:rgba(255,255,255,0.45)">Every night</div>
    <div class="big smash"         style="font-size:160px; animation-delay:.2s">IS</div>
    <div class="big cyan smash"    style="font-size:160px; animation-delay:.4s">DIFFERENT</div>
    <div class="neon-line slide-up" style="animation-delay:.55s; margin:24px 0"></div>
    <div class="body slide-up"     style="font-size:72px; animation-delay:.7s">Be part of the show</div>
  </div>

  <!-- ── SCENE 5: CTA / JOIN TONIGHT (17 – 23 s) ── -->
  <div class="scene" id="s5" style="gap:30px">
    <img class="logo slide-down" src="./the-human-jukebox-logo.png" alt="" style="width:220px;height:220px; animation-delay:.1s" />
    <div class="big smash"         style="font-size:130px; animation-delay:.25s">JOIN</div>
    <div class="big cyan smash"    style="font-size:130px; animation-delay:.4s">TONIGHT</div>
    <div class="neon-line slide-up" style="animation-delay:.6s; margin:10px 0"></div>
    <div class="url slide-up"      style="font-size:52px; animation-delay:.75s; letter-spacing:2px">www.the-human-jukebox.org</div>
    <div class="sub slide-up"      style="font-size:36px; letter-spacing:4px; color:rgba(255,255,255,0.35); animation-delay:.9s">Request · Vote · Shape the night</div>
  </div>

  <div class="flash" id="flash"></div>
</div>

<button id="restart">↺ Replay</button>

<script>
  /* ── Scale stage to fill the viewport ── */
  function scaleStage() {
    const s = document.getElementById('stage')
    const sx = window.innerWidth  / 1080
    const sy = window.innerHeight / 1920
    const sc = Math.min(sx, sy)
    s.style.transform  = `scale(${sc})`
    s.style.marginLeft = `${(window.innerWidth  - 1080 * sc) / 2}px`
    s.style.marginTop  = `${(window.innerHeight - 1920 * sc) / 2}px`
  }
  scaleStage()
  window.addEventListener('resize', scaleStage)

  /* ── Floating music note particles ── */
  const notes = ['♩','♪','♫','♬','♩','♫']
  const pc = document.getElementById('particles')
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div')
    p.className = 'particle'
    p.textContent = notes[Math.floor(Math.random() * notes.length)]
    p.style.left     = `${Math.random() * 100}%`
    p.style.bottom   = `${-5 - Math.random() * 10}%`
    p.style.fontSize = `${1.4 + Math.random() * 2.2}rem`
    p.style.color    = Math.random() > 0.5 ? 'rgba(74,214,255,0.35)' : 'rgba(255,79,152,0.35)'
    const dur  = 9  + Math.random() * 14
    const del  = Math.random() * 12
    p.style.animation = `floatUp ${dur}s ${del}s linear infinite`
    pc.appendChild(p)
  }

  /* ── Visualizer bars ── */
  const vc = document.getElementById('visualizer')
  for (let i = 0; i < 32; i++) {
    const b = document.createElement('div')
    b.className = 'bar'
    const dur = 0.35 + Math.random() * 0.55
    const del = Math.random() * 0.6
    b.style.animation = `barDance ${dur}s ${del}s ease-in-out infinite alternate`
    b.style.height    = `${15 + Math.random() * 85}%`
    vc.appendChild(b)
  }

  /* ── Scene controller ── */
  const scenes  = ['s1','s2','s3','s4','s5']
  const timings = [0, 3500, 8000, 12500, 17000]  // ms
  let current = -1
  let timers  = []

  function flash() {
    const el = document.getElementById('flash')
    el.classList.remove('go')
    void el.offsetWidth
    el.classList.add('go')
  }

  function showScene(idx) {
    flash()
    setTimeout(() => {
      if (current >= 0) {
        const prev = document.getElementById(scenes[current])
        prev.classList.remove('active')
        setTimeout(() => { prev.style.display = 'none' }, 500)
      }
      current = idx
      const el = document.getElementById(scenes[current])
      el.style.display = 'flex'
      void el.offsetWidth
      el.classList.add('active')
    }, 160)
  }

  function startTimeline() {
    // hide all
    scenes.forEach(id => {
      const el = document.getElementById(id)
      el.style.display = 'none'
      el.classList.remove('active')
    })
    current = -1
    timers.forEach(clearTimeout)
    timers = timings.map((t, i) => setTimeout(() => showScene(i), t))
  }

  document.getElementById('restart').addEventListener('click', startTimeline)
  startTimeline()
</script>
</body>
</html>
