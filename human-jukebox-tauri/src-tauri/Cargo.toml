[package]
name = "human_jukebox_tauri"
version = "0.1.0"
description = "Human Jukebox desktop wrapper"
authors = ["Human Jukebox"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
