name: Vercel Dual Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      audience: ${{ steps.filter.outputs.audience }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'human-jukebox-web/**'
              - 'shared/**'
              - '.github/workflows/vercel-dual-deploy.yml'
              - '.github/workflows/vercel-deploy-reusable.yml'
            audience:
              - 'audience-app/**'
              - 'shared/**'
              - '.github/workflows/vercel-dual-deploy.yml'
              - '.github/workflows/vercel-deploy-reusable.yml'

  deploy-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/vercel-deploy-reusable.yml
    with:
      project-directory: human-jukebox-web
    secrets: inherit

  deploy-audience:
    needs: changes
    if: needs.changes.outputs.audience == 'true'
    uses: ./.github/workflows/vercel-deploy-reusable.yml
    with:
      project-directory: audience-app
    secrets: inherit
