name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify critical migration guards
        run: |
          grep -q "crash_telemetry_select_authenticated" supabase-migration.sql
          grep -q "CREATE TABLE IF NOT EXISTS public.crash_telemetry" supabase-migration.sql
